<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#167a62" />
  <meta name="description" content="Aplicativo independente de apontamento de campo, com sincronização ao Gestor de Campo." />
  <title>Apontamento de Campo</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="field-shell">
    <aside class="field-sidebar" id="fieldSidebar">
      <div class="brand-link"><img class="brand-mark" src="icons/icon.svg" width="30" height="30" alt=""><span class="brand-name">Apontamento de Campo</span></div>
      <div class="workspace-label">APONTAMENTO DE CAMPO</div>
      <div class="project-picker"><span class="project-dot"></span><span><strong id="sidebarWork">Carregando…</strong><small>obra selecionada</small></span></div>
      <nav class="field-nav" aria-label="Navegação do apontamento">
        <button class="field-nav-item active" data-route="today" type="button"><span>⌂</span> Hoje</button>
        <button class="field-nav-item" data-route="point" type="button"><span>＋</span> Apontar</button>
        <button class="field-nav-item" data-route="history" type="button"><span>☷</span> Histórico</button>
        <button class="field-nav-item" data-route="reports" type="button"><span>▤</span> Relatórios</button>
        <button class="field-nav-item" data-route="more" type="button"><span>•••</span> Mais</button>
      </nav>
      <div class="sidebar-bottom"><span class="sync-dot"></span><div><strong>Base do apontamento</strong><small>offline + sincronização central</small></div></div>
    </aside>

    <div class="field-main">
      <header class="field-topbar">
        <div><div class="eyebrow" id="workspaceLabel">APONTAMENTO DE CAMPO</div><h1 id="pageTitle">Hoje</h1></div>
        <div class="topbar-actions">
          <label class="work-select-label" for="workSelector">Obra</label>
          <select id="workSelector" class="work-selector" aria-label="Selecionar obra" disabled><option>Carregando obras…</option></select>
          <span id="connectionBadge" class="badge badge-success">Conectando</span>
          <button id="installBtn" class="icon-btn hidden" type="button" aria-label="Instalar aplicativo" title="Instalar aplicativo">↓</button>
        </div>
      </header>
      <main id="mainContent" class="field-content" aria-live="polite"></main>
    </div>

    <nav class="bottom-nav" aria-label="Navegação móvel">
      <button class="field-nav-item active" data-route="today" type="button"><span>⌂</span><small>Hoje</small></button>
      <button class="field-nav-item" data-route="point" type="button"><span>＋</span><small>Apontar</small></button>
      <button class="field-nav-item" data-route="history" type="button"><span>☷</span><small>Histórico</small></button>
      <button class="field-nav-item" data-route="reports" type="button"><span>▤</span><small>Relatórios</small></button>
      <button class="field-nav-item" data-route="more" type="button"><span>•••</span><small>Mais</small></button>
    </nav>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="modalRoot"></div>
  <script src="../local-launch.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
